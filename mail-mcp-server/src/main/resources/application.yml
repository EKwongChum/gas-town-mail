spring:
  application:
    name: mail-mcp-server
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  mcp:
    # MCP Streamable HTTP endpoint (standard MCP server interface)
    endpoint: /mcp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uk.ekwong: INFO
