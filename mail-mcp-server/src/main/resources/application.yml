spring:
  application:
    name: mail-mcp-server
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  mcp:
    # MCP Streamable HTTP endpoint (standard MCP server interface)
    endpoint: /mcp
  download:
    # Batch original-email download: temporary directory for staged .eml files
    # (blank = <java.io.tmpdir>/mail-mcp-server/originals) and per-file TTL
    temp-dir: ${MAIL_DOWNLOAD_TEMP_DIR:}
    file-ttl: ${MAIL_DOWNLOAD_FILE_TTL:30m}
  send:
    # Outbound mail (POST /api/mails/send|reply|forward): attachment limits and SMTP timeouts
    max-attachment-size: ${MAIL_SEND_MAX_ATTACHMENT_SIZE:10MB}
    max-total-attachment-size: ${MAIL_SEND_MAX_TOTAL_ATTACHMENT_SIZE:20MB}
    connect-timeout: ${MAIL_SEND_CONNECT_TIMEOUT:10s}
    read-timeout: ${MAIL_SEND_READ_TIMEOUT:30s}
    write-timeout: ${MAIL_SEND_WRITE_TIMEOUT:60s}
  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: journal-emails
      path-style: true
      create-bucket-if-missing: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uk.ekwong: INFO
  pattern:
    level: "%5p [%X{traceId:-}]"
