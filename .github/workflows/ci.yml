name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, format & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, format-check and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: |
            mail-common/target/site/jacoco
            journal-archiver/target/site/jacoco
            mail-cleaner/target/site/jacoco
            mail-mcp-server/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: mail-common/target/site/jacoco/jacoco.xml,journal-archiver/target/site/jacoco/jacoco.xml,mail-cleaner/target/site/jacoco/jacoco.xml,mail-mcp-server/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
